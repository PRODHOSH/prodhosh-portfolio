# ================================
# 🐳 PRODHOSH PORTFOLIO - DOCKER COMPOSE
# ================================
# Quick start: docker-compose up -d

version: '3.8'

services:
  # 🌐 Static Export with Nginx (Recommended for portfolio)
  portfolio-static:
    build:
      context: .
      dockerfile: Dockerfile.static
    container_name: prodhosh-portfolio-static
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.prodhosh.description=Portfolio Static Site"
      - "com.prodhosh.version=1.0.0"

  # 🚀 Next.js Server Mode (Alternative)
  portfolio-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodhosh-portfolio-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    profiles:
      - server  # Only starts with: docker-compose --profile server up
    labels:
      - "com.prodhosh.description=Portfolio Next.js Server"
      - "com.prodhosh.version=1.0.0"

  # 🛠️ Development Mode
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: prodhosh-portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    profiles:
      - dev  # Only starts with: docker-compose --profile dev up
    labels:
      - "com.prodhosh.description=Portfolio Development"

networks:
  default:
    name: prodhosh-network
